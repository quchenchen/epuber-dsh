# Official Team composition. The official service owns execution.
# `tool-subagent-list-agents` existed only before 0.2.2; disabling an id that the
# official Profile no longer publishes is a no-op that warns on every config load.
- id: tool-subagent-control
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 16
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
    - id: client-ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
    - id: epuberdsh-experts
      name: epuberdsh-plugin-experts
